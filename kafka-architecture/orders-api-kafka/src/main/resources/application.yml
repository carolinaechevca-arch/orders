server:
  port: ${SERVER_PORT:3000}

spring:
  application:
    name: orders-api-kafka
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
        retry.backoff.ms: 1000

app:
  kafka:
    topic: ${KAFKA_TOPIC:orders.events}
    partitions: ${KAFKA_PARTITIONS:2}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}, orderId=%X{orderId:-}]"
