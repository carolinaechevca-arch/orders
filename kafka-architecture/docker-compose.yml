services:
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  orders-api-kafka:
    build: ./orders-api-kafka
    ports:
      - "3000:3000"
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: orders.events
      KAFKA_PARTITIONS: 2
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  inventory-consumer-kafka:
    build: ./inventory-consumer-kafka
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: orders.events
      KAFKA_GROUP_ID: inventory-service-group
    depends_on:
      orders-api-kafka:
        condition: service_healthy
    restart: unless-stopped

  billing-consumer-kafka:
    build: ./billing-consumer-kafka
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: orders.events
      KAFKA_GROUP_ID: billing-service-group
    depends_on:
      orders-api-kafka:
        condition: service_healthy
    restart: unless-stopped

  notification-consumer-kafka:
    build: ./notification-consumer-kafka
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: orders.events
      KAFKA_GROUP_ID: notification-service-group
    depends_on:
      orders-api-kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data:
