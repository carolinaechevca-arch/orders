server:
  port: ${SERVER_PORT:3000}

spring:
  application:
    name: orders-api-rabbitmq
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:orders}
    password: ${RABBITMQ_PASSWORD:orders}
    connection-timeout: 10s
    template:
      retry:
        enabled: true
        initial-interval: 2s
        max-attempts: 8
        multiplier: 1.5

app:
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:orders.exchange}
    queue: ${RABBITMQ_QUEUE:orders.queue}
    routing-key: ${RABBITMQ_ROUTING_KEY:orders.process}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}, orderId=%X{orderId:-}]"
